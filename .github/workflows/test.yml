name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify skill installation
        run: python skills/aliyun-deploy-router/scripts/check_install.py
      - name: Run offline regression tests
        run: python -B -m unittest discover -s skills/aliyun-deploy-router/tests -v
